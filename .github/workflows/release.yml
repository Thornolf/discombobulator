name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: rustup show
      - name: Build installer
        working-directory: crates/desktop
        run: ../../web/node_modules/.bin/tauri build --bundles nsis
      - name: Sign installer for the updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this release will not reach installed apps through the updater"
            exit 0
          fi
          for installer in target/release/bundle/nsis/*.exe; do
            web/node_modules/.bin/tauri signer sign --app-version "${TAG#v}" "$installer"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  upload-installer:
    needs: [release-please, build-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installer
          path: installer
      - name: Upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          installers=(installer/*.exe)
          [ "${#installers[@]}" -eq 1 ] || { echo "expected one installer, found ${#installers[@]}"; exit 1; }
          installer="${installers[0]}"
          assets=("$installer")
          if [ -f "$installer.sig" ]; then
            name=$(basename "$installer")
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
            jq -n \
              --arg version "${TAG#v}" \
              --rawfile notes notes.md \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --rawfile signature "$installer.sig" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
              > latest.json
            assets+=("$installer.sig" latest.json)
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

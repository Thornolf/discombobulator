[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/desktop", "crates/xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Thornolf/discombobulator"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
